services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  seed:
    build: .
    profiles: [tools]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-insightflow}
      PGUSER: ${POSTGRES_USER:-insightflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-insightflow_local_only}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/seed_database.py"]

volumes:
  postgres_data:
